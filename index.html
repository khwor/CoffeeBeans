<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaffee">
<meta name="theme-color" content="#0e0e10">
<title>Kaffee</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0e0e10}
html,body{margin:0;min-height:100%;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{--screen-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 8px env(safe-area-inset-bottom);min-height:100vh;max-width:480px;margin:0 auto}
@supports (height:100dvh){body{--screen-height:100dvh}}
main[hidden]{display:none}
footer{margin-top:32px;padding:0 0 8px}
footer button{width:100%}
button{font:inherit;color:#f2f2f2;background:#2a2a2e;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button:active{opacity:.6}
button.primary{background:#e8a33d;color:#111;font-weight:700}
button.danger{background:#7a2a2a}
#grid{height:calc(var(--screen-height) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 8px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
/* Abstand Sekunden zu unterem Rand */
.selection-card{position:relative;width:100%;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:16px 12px 12px;text-align:left;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:16px;overflow:hidden;cursor:pointer}
.selection-card .bar{position:absolute;top:0;left:0;right:0;height:8px}
/* Übersicht Titel Schriftgrösse*/
.selection-card .title{font-size:26px;font-weight:700;line-height:1.2}
.selection-open{width:100%;border:0;background:transparent;color:#f2f2f2;font:inherit;text-align:left;padding:0;cursor:pointer}
.selection-open.title{font-size:26px;font-weight:700;line-height:1.2}
/* Übersicht Schriftgrösse Infos (Hersteller, Herkunft, Roast, Process)*/
.selection-card .summary{font-size:14px;color:#9a9a9f}
.selection-profile{width:100%;margin:auto 0;text-align:center;font-size:12px;color:#9a9a9f}
.selection-metrics{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:4px;margin-top:auto;text-align:center}
.selection-field{width:auto;border:0;border-radius:4px;background:transparent;color:inherit;font:inherit;padding:2px;cursor:pointer}
.selection-doses,.selection-times{width:100%;display:flex;justify-content:space-between;align-items:center}
.selection-doses .selection-dose,.selection-times .selection-time{flex:1}
.selection-doses .selection-dose:first-child,.selection-times .selection-time:first-child{text-align:left}
.selection-doses .selection-dose:last-child,.selection-times .selection-time:last-child{text-align:right}
/* Übersicht Schriftgrösse Dose*/
.selection-dose{font-size:14px;color:#9a9a9f}
.selection-grind{min-height:76px;background:#232327;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
/* Übersicht Schriftgrösse Grind*/
.selection-grind-value{width:100%;flex:1;font-size:40px;font-weight:700;line-height:1.1;color:#e8a33d}
.selection-rpm{width:100%;margin-top:3px;font-size:13px;color:#bdbdc2}
/* Übersicht Schriftgrösse Sekunden*/
.selection-time{font-size:14px;color:#9a9a9f}
.detail-nav{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px}
.detail-nav button{flex:1}
.detail-card{min-height:calc(var(--screen-height) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 64px);padding-bottom:12px}
.detail-empty{align-items:center;justify-content:center;text-align:center}
.detail-notes{white-space:pre-line}
.detail-empty .plus{font-size:40px;color:#e8a33d}
.card{position:relative;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:16px;padding:16px 10px 8px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.card .bar{position:absolute;top:0;left:0;right:0;height:8px}
/* Titel Namen */
.card .name{font-size:20px;font-weight:700;line-height:1.15}
.card .sub{font-size:11px;color:#9a9a9f}
.card .profile{text-align:center}
.card .coffee-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.detail-card .coffee-meta{flex-direction:column;align-items:flex-start;gap:2px}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}
.tag{font-size:10px;background:#2a2a2e;border-radius:8px;padding:2px 6px}
.metric-group{margin-top:auto;display:flex;flex-direction:column;gap:0}
.big{display:flex;gap:6px}
.big .metric{flex:1;min-width:0;text-align:center;cursor:pointer}
.metric-dose{margin-bottom:3px;text-align:center;font-size:10px;color:#9a9a9f}
.metric-tile{background:#232327;border-radius:10px;padding:6px 4px;height:72px;display:flex;flex-direction:column;justify-content:center}
.big b{display:block;font-size:22px;color:#e8a33d}
.metric-label{display:block;margin-top:3px;font-size:9px;color:#9a9a9f;text-transform:uppercase}
.big .rpm{display:block;margin-top:2px;font-size:11px;color:#bdbdc2}
.actual-time{display:block;margin-top:3px;font-size:11px;color:#bdbdc2}
.meta{font-size:11px;color:#bdbdc2;display:flex;justify-content:space-between;gap:4px}
.detail-card .name{font-size:40px;line-height:1.2}
.detail-card .sub,.detail-card .date,.detail-card .meta{font-size:16px}
.detail-card .tag{font-size:15px;padding:4px 7px}
.detail-card .metric-dose{font-size:16px}
.detail-card .metric-tile{height:84px}
.detail-card .big b{font-size:28px}
.detail-card .metric-label{font-size:14px}
.detail-card .rpm,.detail-card .actual-time{font-size:16px}
.detail-card .detail-notes{font-size:17px}
.empty{align-items:center;justify-content:center;color:#6a6a70;font-size:14px}
.empty .plus{font-size:40px;line-height:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
#sheet.open{display:block}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:#17171a;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
#panel h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:11px;color:#9a9a9f;margin:10px 0 3px;text-transform:uppercase}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:#f2f2f2;background:#232327;border:1px solid #333;border-radius:10px;padding:9px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{text-align:center}
.stepper button{width:44px;padding:9px 0;font-size:20px}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:#232327;border:1px solid #333;border-radius:16px;padding:7px 11px;font-size:14px}
.chip.sel{background:#e8a33d;border-color:#e8a33d;color:#111;font-weight:600}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions button{flex:1}
.hitem{background:#1f1f23;border-radius:12px;padding:10px;margin-bottom:8px}
.hitem .t{font-weight:700}
.hitem .s{font-size:12px;color:#9a9a9f;margin-top:2px;white-space:pre-line}
.hitem .a{display:flex;gap:6px;margin-top:8px}
.hitem .a button{flex:1;padding:8px;font-size:13px}
/* Kachel v3 */
.card .date{font-size:11px;color:#9a9a9f}
</style>
</head>
<body>
<main id="homeView">
  <div id="grid"></div>
  <footer><button onclick="openHist()">Historie</button></footer>
</main>
<main id="detailView" hidden>
  <header class="detail-nav">
    <button onclick="goHome()">← Auswahl</button>
    <button onclick="openHist()">Historie</button>
  </header>
  <div id="detail"></div>
</main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="panel"></div></div>

<script>
// --- CONFIG.JS ---
// Speicherschlüssel – NICHT ändern, sonst sind die Daten weg
const KEY='kaffee-v1';

// Deckelfarben
const COLORS=['#e63946','#f4a261','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e84393','#ecf0f1','#2d3436'];

// Auswahllisten
const PROCESSING=['Natural','Washed','Honey','Anaerob','Carbonic Maceration','Wet Hulled','Experimental','Tabi Natural'];
const ROAST=['Espresso','Omni','Filter'];
const PUCKPREP=['RDT','Shaker Funnel','Puck Screen','Leveler','WDT','Tamper','Papierfilter unten','Papierfilter oben'];
const BASKET=['15g VST','18g VST','20g VST','IMS'];

// Stepper: [Schrittweite, Minimum, Maximum]
const STEP={
  grind:[0.5,0,100],
  rpm:[50,0,3000],
  time:[1,0,120],
  actualTime:[1,0,120],
  dose:[0.1,0,40],
  yield:[0.5,0,100],
  temp:[0.5,70,100]
};

// --- APP.JS ---
let S=load();
let edit=null;
let currentPage='home';
let activeSlot=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.slots)return d}catch(e){}
  return{slots:[0,1,2,3].map(i=>({color:COLORS[i*2%COLORS.length],coffee:null})),history:[]};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]))}
function days(d){if(!d)return null;const n=Math.floor((Date.now()-new Date(d))/864e5);return n>=0?n:null}
function ppList(c){return Array.isArray(c.puckPrep)?c.puckPrep:[]}
function fmtDate(d){if(!d)return'';const p=d.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0].slice(2):d}
function render(){
  document.getElementById('homeView').hidden=currentPage!=='home';
  document.getElementById('detailView').hidden=currentPage!=='detail';
  const g=document.getElementById('grid');
  g.innerHTML=S.slots.map((s,i)=>{
    const c=s.coffee;
    const summary=c?[c.roaster,c.origin,c.roastType,c.process].filter(Boolean).map(esc).join(' · '):'Antippen zum Hinzufügen';
    const profile=c&&c.profile?`<div class="selection-profile">${esc(c.profile)}</div>`:'';
    const metrics=c?`<div class="selection-metrics">
      <div class="selection-doses">
        <button class="selection-field selection-dose" aria-label="Dose In bearbeiten" onclick="openQuickEdit(event,${i},'dose')">In: ${c.dose!=null?esc(c.dose)+'g':'–'}</button>
        <button class="selection-field selection-dose" aria-label="Dose Out bearbeiten" onclick="openQuickEdit(event,${i},'yield')">Out: ${c.yield!=null?esc(c.yield)+'g':'–'}</button>
      </div>
      <div class="selection-grind" onclick="openQuickEdit(event,${i},'grind')">
        <button class="selection-field selection-grind-value" aria-label="Mahlgrad bearbeiten" onclick="openQuickEdit(event,${i},'grind')">${c.grind!=null?esc(c.grind):'–'}</button>
        <button class="selection-field selection-rpm" aria-label="RPM bearbeiten" onclick="openQuickEdit(event,${i},'rpm')">${c.rpm!=null?esc(c.rpm)+' RPM':'RPM –'}</button>
      </div>
      <div class="selection-times">
        <button class="selection-field selection-time" aria-label="Soll-Zeit bearbeiten" onclick="openQuickEdit(event,${i},'time')">${c.time!=null?esc(c.time)+'s':'–'}</button>
        <button class="selection-field selection-time" aria-label="Ist-Zeit bearbeiten" onclick="openQuickEdit(event,${i},'actualTime')">${c.actualTime!=null?esc(c.actualTime)+'s':'–'}</button>
      </div>
    </div>`:'';
    return`<article class="selection-card" onclick="openCoffee(${i})">
      <span class="bar" style="background:${s.color}"></span>
      <button class="selection-open title" onclick="event.stopPropagation();openCoffee(${i})">${c?esc(c.name)||'Kaffee':'Kaffee hinzufügen'}</button>
      ${summary?`<span class="summary">${summary}</span>`:''}
      ${profile}
      ${metrics}
    </article>`;
  }).join('');
  if(currentPage==='detail')renderDetail();
}

function openCoffee(i){
  activeSlot=i;
  currentPage='detail';
  render();
  window.scrollTo(0,0);
}
function goHome(){
  activeSlot=null;
  currentPage='home';
  render();
  window.scrollTo(0,0);
}
function renderDetail(){
  const s=S.slots[activeSlot];
  const detail=document.getElementById('detail');
  if(!s)return;
  const c=s.coffee;
  if(!c){
    detail.innerHTML=`<section class="card empty detail-card detail-empty">
        <div class="bar" style="background:${s.color}"></div>
        <div class="plus">+</div>
        <h2>Hier ist noch kein Kaffee hinterlegt</h2>
        <button class="primary" onclick="openEdit(${activeSlot})">Kaffee eintragen</button>
    </section>`;
    return;
  }
  const originProcess=[c.origin,c.process].filter(Boolean).map(esc).join(' · ');
  const roasterType=[c.roaster,c.roastType].filter(Boolean).map(esc).join(' · ');
  const tags=(c.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const puckPrep=ppList(c).map(esc).join(' · ');
  const temperature=c.temp!=null?c.temp+' °C':'';
  detail.innerHTML=`<article class="card detail-card">
    <div class="bar" style="background:${s.color}"></div>
    <div class="name">${esc(c.name)||'–'}</div>
    ${originProcess||roasterType?`<div class="coffee-meta">${originProcess?`<span class="sub">${originProcess}</span>`:''}${roasterType?`<span class="sub">${roasterType}</span>`:''}</div>`:''}
    ${c.roastDate?`<div class="date">${fmtDate(c.roastDate)}</div>`:''}
    ${tags?`<div class="tags">${tags}</div>`:''}
    ${puckPrep?`<div class="sub">${puckPrep}</div>`:''}
    ${c.basket?`<div class="sub">Sieb: ${esc(c.basket)}</div>`:''}
    <div class="metric-group">
      ${c.profile?`<div class="sub profile">${esc(c.profile)}</div>`:''}
      <div class="big">
        <div class="metric">
          <div class="metric-dose">In: ${c.dose!=null?esc(c.dose)+'g':'–'}</div>
          <div class="metric-tile"><b>${c.grind!=null?esc(c.grind):'–'}</b>${c.rpm!=null?`<span class="rpm">${esc(c.rpm)} RPM</span>`:''}</div>
          <span class="metric-label">Mahlgrad</span>
        </div>
        <div class="metric">
          <div class="metric-dose">Out: ${c.yield!=null?esc(c.yield)+'g':'–'}</div>
          <div class="metric-tile"><b>${c.time!=null?esc(c.time)+'s':'–'}</b><span class="actual-time">IST ${c.actualTime!=null?esc(c.actualTime)+'s':'–'}</span></div>
          <span class="metric-label">Zeit</span>
        </div>
      </div>
    </div>
    ${temperature||c.updated?`<div class="meta"><span>${temperature?'Temperatur: '+esc(temperature):''}</span><span>${c.updated?'Aktualisiert: '+fmtDate(c.updated):''}</span></div>`:''}
    ${c.notes?`<div class="sub detail-notes">Notizen: ${esc(c.notes)}</div>`:''}
    <button class="primary" onclick="openEdit(${activeSlot})">Bearbeiten</button>
  </article>`;
}

function openQuickEdit(event,i,kind){
  event.stopPropagation();
  edit=i;
  const c=S.slots[i].coffee;
  const labels={grind:'Mahlgrad',rpm:'Drehzahl (RPM)',dose:'Dose In (g)',yield:'Dose Out (g)',time:'Soll-Zeit (s)',actualTime:'Ist-Zeit (s)'};
  const label=labels[kind];
  const fields=`<label>${label}</label>${stepper('quick_'+kind,c[kind]!=null?c[kind]:'',...STEP[kind])}`;
  document.getElementById('panel').innerHTML=`<h2>${label}</h2>${fields}
    <div class="actions">
      <button class="primary" onclick="saveQuickEdit('${kind}')">Speichern</button>
      <button onclick="closeSheet()">Abbrechen</button>
    </div>`;
  document.getElementById('sheet').classList.add('open');
}

function stepper(id,val,step,min,max){
  return`<div class="stepper"><button onclick="step('${id}',-${step},${min},${max})">−</button><input id="${id}" type="number" inputmode="decimal" step="${step}" value="${esc(val)}"><button onclick="step('${id}',${step},${min},${max})">+</button></div>`;
}
function step(id,d,min,max){
  const el=document.getElementById(id);
  let v=parseFloat(el.value);if(isNaN(v))v=0;
  v=Math.round((v+d)*100)/100;
  if(min!=null&&v<min)v=min;if(max!=null&&v>max)v=max;
  el.value=v;
}

function openEdit(i,prefill){
  edit=i;
  const s=S.slots[i];
  const c=prefill||s.coffee||{};
  const v=id=>c[id]!=null?c[id]:'';
  const profileOptions=Array.from(new Set([
    ...S.slots.map(slot=>slot.coffee&&slot.coffee.profile),
    ...S.history.map(item=>item.profile),
    v('profile')
  ].filter(Boolean)));
  const f=(id,label,type)=>{
    if(type==='text')return`<label>${label}</label><input id="f_${id}" value="${esc(v(id))}">`;
    if(type==='date')return`<label>${label}</label><input id="f_${id}" type="date" value="${esc(v(id))}">`;
    if(type==='profile')return`<label>${label}</label><input id="f_${id}" list="${id}-options" value="${esc(v(id))}"><datalist id="${id}-options">${profileOptions.map(profile=>`<option value="${esc(profile)}">`).join('')}</datalist>`;
    if(type==='area')return`<label>${label}</label><textarea id="f_${id}" rows="3">${esc(v(id))}</textarea>`;
    if(type==='num')return`<label>${label}</label>${stepper('f_'+id,v(id),...STEP[id])}`;
  };
  const sel=(id,label,opts)=>`<label>${label}</label><select id="f_${id}"><option value="">–</option>${opts.map(o=>`<option${c[id]===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  const pp=ppList(c);
  const chips=PUCKPREP.map(o=>`<div class="chip${pp.includes(o)?' sel':''}" onclick="this.classList.toggle('sel')">${esc(o)}</div>`).join('');
  const sw=COLORS.map(col=>`<div class="sw ${col===s.color?'sel':''}" style="background:${col}" onclick="pickColor('${col}',this)"></div>`).join('');
  document.getElementById('panel').innerHTML=`
    <h2>${c.name?esc(c.name):'Kaffee hinzufügen'}</h2>
    <label>Deckelfarbe</label><div class="colors" id="colors">${sw}</div>
    ${f('name','Name','text')}
    <div class="row"><div>${f('origin','Herkunft','text')}</div><div>${sel('process','Processing',PROCESSING)}</div></div>
    <div class="row"><div>${f('roaster','Rösterei','text')}</div><div>${sel('roastType','Röstart',ROAST)}</div></div>
    ${f('tags','Geschmack (Komma getrennt)','text')}
    ${f('roastDate','Röstdatum','date')}
    ${f('profile','DE1-Profil','profile')}
    <div class="row"><div>${f('grind','Mahlgrad','num')}</div><div>${f('rpm','Drehzahl (RPM)','num')}</div></div>
    <div class="row"><div>${f('dose','Dosis (g)','num')}</div><div>${f('yield','Ertrag (g)','num')}</div></div>
    <div class="row"><div>${f('time','Soll-Zeit (s)','num')}</div><div>${f('actualTime','Ist-Zeit (s)','num')}</div></div>
    ${f('temp','Temperatur (°C)','num')}
    ${sel('basket','Sieb',BASKET)}
    <label>Puck Prep</label><div class="chips" id="pp">${chips}</div>
    ${f('notes','Notizen','area')}
    <div class="actions">
      <button class="primary" onclick="saveEdit()">Speichern</button>
      <button onclick="closeSheet()">Abbrechen</button>
    </div>
    <div class="actions">
      ${s.coffee?'<button class="danger" onclick="finish()">Aufgebraucht → Historie</button>':''}
      <button onclick="openHist(true)">Aus Historie laden</button>
    </div>`;
  document.getElementById('sheet').classList.add('open');
}
function pickColor(col,el){
  S.slots[edit].color=col;
  document.querySelectorAll('#colors .sw').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');edit=null}
function val(id){const el=document.getElementById('f_'+id);return el?el.value.trim():''}
function num(id){const v=val(id);return v===''?null:parseFloat(v)}

function readForm(){
  return{
    name:val('name'),roaster:val('roaster'),origin:val('origin'),
    process:val('process'),roastType:val('roastType'),tags:val('tags'),
    roastDate:val('roastDate'),profile:val('profile'),
    grind:num('grind'),rpm:num('rpm'),time:num('time'),actualTime:num('actualTime'),dose:num('dose'),yield:num('yield'),temp:num('temp'),
    puckPrep:Array.from(document.querySelectorAll('#pp .chip.sel')).map(x=>x.textContent),
    basket:val('basket'),notes:val('notes'),updated:today()
  };
}
function saveEdit(){
  const c=readForm();
  if(!c.name){alert('Bitte einen Namen eingeben.');return}
  S.slots[edit].coffee=c;
  save();render();closeSheet();
}
function saveQuickEdit(kind){
  const c=S.slots[edit].coffee;
  const value=document.getElementById('quick_'+kind).value;
  c[kind]=value===''?null:parseFloat(value);
  c.updated=today();
  save();render();closeSheet();
}
function keyOf(c){return((c.name||'')+'|'+(c.roaster||'')).toLowerCase()}
function finish(){
  const c=S.slots[edit].coffee;
  if(!c)return;
  if(!confirm('Kaffee „'+c.name+'“ in die Historie verschieben?'))return;
  const k=keyOf(c);
  let h=S.history.find(x=>keyOf(x)===k);
  if(h){
    h.versions=h.versions||[];
    h.versions.push({date:h.updated,grind:h.grind,rpm:h.rpm,time:h.time,actualTime:h.actualTime,dose:h.dose,yield:h.yield,temp:h.temp,profile:h.profile,roastDate:h.roastDate,puckPrep:h.puckPrep,basket:h.basket});
    Object.assign(h,c,{versions:h.versions});
  }else{
    S.history.unshift(Object.assign({versions:[]},c));
  }
  S.slots[edit].coffee=null;
  activeSlot=null;
  currentPage='home';
  save();render();closeSheet();
}

function openHist(pick){
  const slot=pick===true?edit:null;
  const list=S.history.map((h,i)=>{
    const v=(h.versions||[]).slice().reverse().map(x=>`${x.date||'?'}: Mahlgrad ${x.grind||'?'}${x.rpm?' @ '+x.rpm+' RPM':''}, Soll ${x.time||'?'}s${x.actualTime!=null?', Ist '+x.actualTime+'s':''}, ${x.dose||'?'}→${x.yield||'?'}g${x.profile?', '+x.profile:''}`).join('\n');
    const info=[h.origin,h.process,h.roaster,h.roastType].filter(Boolean).map(esc).join(' · ');
    const pp=ppList(h).join(', ');
    return`<div class="hitem"><div class="t">${esc(h.name)}</div>
      <div class="s">${info}${h.tags?' · '+esc(h.tags):''}
Zuletzt (${h.updated||'?'}): Mahlgrad ${h.grind||'?'}${h.rpm?' @ '+h.rpm+' RPM':''}, Soll ${h.time||'?'}s${h.actualTime!=null?', Ist '+h.actualTime+'s':''}, ${h.dose||'?'}→${h.yield||'?'}g${h.temp?', '+h.temp+'°':''}${h.profile?'\nProfil: '+esc(h.profile):''}${pp?'\nPuck Prep: '+esc(pp):''}${v?'\n\nFrühere Einstellungen:\n'+esc(v):''}</div>
      <div class="a">
        <button class="primary" onclick="loadHist(${i})">In Slot laden</button>
        <button class="danger" onclick="delHist(${i})">Löschen</button>
      </div></div>`;
  }).join('')||'<div class="sub" style="padding:12px;color:#9a9a9f">Noch keine Einträge.</div>';
  document.getElementById('panel').innerHTML=`<h2>Historie</h2>${list}
    <div class="actions">
      <button onclick="exportData()">Backup exportieren</button>
      <button onclick="document.getElementById('imp').click()">Backup importieren</button>
      <input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this)">
    </div>
    <div class="actions"><button onclick="${slot!=null?'openEdit('+slot+')':'closeSheet()'}">Zurück</button></div>`;
  document.getElementById('sheet').classList.add('open');
  window._histSlot=slot;
}
function loadHist(i){
  let slot=window._histSlot;
  if(slot==null){
    const free=S.slots.findIndex(s=>!s.coffee);
    const ans=prompt('In welchen Slot laden? (1–4)',free>=0?free+1:'1');
    if(!ans)return;
    slot=parseInt(ans)-1;
    if(!(slot>=0&&slot<4))return;
  }
  const h=Object.assign({},S.history[i]);
  delete h.versions;
  activeSlot=slot;
  currentPage='detail';
  render();
  openEdit(slot,h);
}
function delHist(i){
  if(!confirm('Eintrag löschen?'))return;
  S.history.splice(i,1);save();openHist(window._histSlot!=null?true:undefined);
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const f=new File([blob],'kaffee-backup-'+today()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f]}).catch(()=>{});
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();
  }
}
function importData(inp){
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.slots||!d.history)throw 0;
      if(confirm('Aktuelle Daten durch Backup ersetzen?')){S=d;save();render();closeSheet()}
    }catch(e){alert('Ungültige Datei.')}
  };
  r.readAsText(file);
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();
</script>
</body>
</html>
