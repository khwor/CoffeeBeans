<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaffee">
<meta name="theme-color" content="#0e0e10">
<title>Kaffee</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0e0e10}
html,body{margin:0;min-height:100%;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px}
header h1{font-size:18px;margin:0}
button{font:inherit;color:#f2f2f2;background:#2a2a2e;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button:active{opacity:.6}
button.primary{background:#e8a33d;color:#111;font-weight:700}
button.danger{background:#7a2a2a}
header button{padding:7px 12px;font-size:14px}
#grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(300px,1fr);gap:8px;padding-bottom:8px}
.card{position:relative;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:16px;padding:16px 10px 8px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.card .bar{position:absolute;top:0;left:0;right:0;height:8px}
.card .name{font-size:15px;font-weight:700;line-height:1.15}
.card .sub{font-size:11px;color:#9a9a9f}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}
.tag{font-size:10px;background:#2a2a2e;border-radius:8px;padding:2px 6px}
.big{display:flex;gap:6px;margin-top:auto}
.big div{flex:1;background:#232327;border-radius:10px;padding:6px 4px;text-align:center}
.big b{display:block;font-size:22px;color:#e8a33d}
.big span{font-size:9px;color:#9a9a9f;text-transform:uppercase}
.meta{font-size:11px;color:#bdbdc2;display:flex;justify-content:space-between;gap:4px}
.empty{align-items:center;justify-content:center;color:#6a6a70;font-size:14px}
.empty .plus{font-size:40px;line-height:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
#sheet.open{display:block}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:#17171a;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
#panel h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:11px;color:#9a9a9f;margin:10px 0 3px;text-transform:uppercase}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:#f2f2f2;background:#232327;border:1px solid #333;border-radius:10px;padding:9px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{text-align:center}
.stepper button{width:44px;padding:9px 0;font-size:20px}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions button{flex:1}
.hitem{background:#1f1f23;border-radius:12px;padding:10px;margin-bottom:8px}
.hitem .t{font-weight:700}
.hitem .s{font-size:12px;color:#9a9a9f;margin-top:2px;white-space:pre-line}
.hitem .a{display:flex;gap:6px;margin-top:8px}
.hitem .a button{flex:1;padding:8px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>☕ Kaffee</h1>
  <button onclick="openHist()">Historie</button>
</header>
<div id="grid"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="panel"></div></div>

<script>
const KEY='kaffee-v1';
const COLORS=['#e63946','#f4a261','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e84393','#ecf0f1','#2d3436'];
const FIELDS=[
  ['name','Name','text'],['roaster','Rösterei','text'],['origin','Herkunft','text'],
  ['tags','Geschmack (Komma getrennt)','text'],['roastDate','Röstdatum','date'],
  ['profile','DE1-Profil','text'],['rating','Bewertung (0–5)','num',0,5,0.5],['notes','Notizen','area']
];
let S=load();
let edit=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.slots)return d}catch(e){}
  return{slots:[0,1,2,3].map(i=>({color:COLORS[i*2%COLORS.length],coffee:null})),history:[]};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]))}
function days(d){if(!d)return null;const n=Math.floor((Date.now()-new Date(d))/864e5);return n>=0?n:null}

function render(){
  const g=document.getElementById('grid');
  g.innerHTML=S.slots.map((s,i)=>{
    const c=s.coffee;
    if(!c)return`<div class="card empty" onclick="openEdit(${i})"><div class="bar" style="background:${s.color}"></div><div class="plus">+</div>Slot ${i+1}<br>leer</div>`;
    const d=days(c.roastDate);
    const ratio=(c.dose&&c.yield)?'1:'+(c.yield/c.dose).toFixed(1):'';
    const tags=(c.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    return`<div class="card" onclick="openEdit(${i})"><div class="bar" style="background:${s.color}"></div>
      <div class="name">${esc(c.name)||'–'}</div>
      <div class="sub">${esc(c.roaster)}${c.roaster&&c.origin?' · ':''}${esc(c.origin)}</div>
      <div class="tags">${tags}</div>
      <div class="sub">${esc(c.profile)||''}</div>
      <div class="big"><div><b>${c.grind||'–'}</b><span>Mahlgrad</span></div><div><b>${c.time||'–'}s</b><span>Zeit</span></div></div>
      <div class="meta"><span>${c.dose||'?'}→${c.yield||'?'}g ${ratio}</span><span>${c.temp?c.temp+'°':''}</span></div>
      <div class="meta"><span>${d!=null?d+' Tage':''}</span><span>${c.rating?'★ '+c.rating:''}</span></div>
    </div>`;
  }).join('');
}

function stepper(id,val,step,min,max){
  return`<div class="stepper"><button onclick="step('${id}',-${step},${min},${max})">−</button><input id="${id}" type="number" inputmode="decimal" step="${step}" value="${esc(val)}"><button onclick="step('${id}',${step},${min},${max})">+</button></div>`;
}
function step(id,d,min,max){
  const el=document.getElementById(id);
  let v=parseFloat(el.value);if(isNaN(v))v=0;
  v=Math.round((v+d)*100)/100;
  if(min!=null&&v<min)v=min;if(max!=null&&v>max)v=max;
  el.value=v;
}

function openEdit(i,prefill){
  edit=i;
  const s=S.slots[i];
  const c=prefill||s.coffee||{};
  const f=(id,label,type,min,max,st)=>{
    const v=c[id]!=null?c[id]:'';
    if(type==='text')return`<label>${label}</label><input id="f_${id}" value="${esc(v)}">`;
    if(type==='date')return`<label>${label}</label><input id="f_${id}" type="date" value="${esc(v)}">`;
    if(type==='area')return`<label>${label}</label><textarea id="f_${id}" rows="3">${esc(v)}</textarea>`;
    if(type==='num')return`<label>${label}</label>${stepper('f_'+id,v,st,min,max)}`;
  };
  const sw=COLORS.map(col=>`<div class="sw ${col===s.color?'sel':''}" style="background:${col}" onclick="pickColor('${col}',this)"></div>`).join('');
  document.getElementById('panel').innerHTML=`
    <h2>Slot ${i+1}</h2>
    <label>Deckelfarbe</label><div class="colors" id="colors">${sw}</div>
    ${f('name','Name','text')}${f('roaster','Rösterei','text')}${f('origin','Herkunft','text')}
    ${f('tags','Geschmack (Komma getrennt)','text')}
    <div class="row"><div>${f('roastDate','Röstdatum','date')}</div><div>${f('rating','Bewertung','num',0,5,0.5)}</div></div>
    ${f('profile','DE1-Profil','text')}
    <div class="row"><div><label>Mahlgrad</label>${stepper('f_grind',c.grind!=null?c.grind:'',0.5,0,100)}</div>
    <div><label>Zeit (s)</label>${stepper('f_time',c.time!=null?c.time:'',1,0,120)}</div></div>
    <div class="row"><div><label>Dosis (g)</label>${stepper('f_dose',c.dose!=null?c.dose:'',0.1,0,40)}</div>
    <div><label>Ertrag (g)</label>${stepper('f_yield',c.yield!=null?c.yield:'',0.5,0,100)}</div></div>
    <label>Temperatur (°C)</label>${stepper('f_temp',c.temp!=null?c.temp:'',0.5,70,100)}
    ${f('notes','Notizen','area')}
    <div class="actions">
      <button class="primary" onclick="saveEdit()">Speichern</button>
      <button onclick="closeSheet()">Abbrechen</button>
    </div>
    <div class="actions">
      ${s.coffee?'<button class="danger" onclick="finish()">Aufgebraucht → Historie</button>':''}
      <button onclick="openHist(true)">Aus Historie laden</button>
    </div>`;
  document.getElementById('sheet').classList.add('open');
}
function pickColor(col,el){
  S.slots[edit].color=col;
  document.querySelectorAll('#colors .sw').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');edit=null}
function val(id){const el=document.getElementById('f_'+id);return el?el.value.trim():''}
function num(id){const v=val(id);return v===''?null:parseFloat(v)}

function readForm(){
  return{
    name:val('name'),roaster:val('roaster'),origin:val('origin'),tags:val('tags'),
    roastDate:val('roastDate'),rating:num('rating'),profile:val('profile'),
    grind:num('grind'),time:num('time'),dose:num('dose'),yield:num('yield'),temp:num('temp'),
    notes:val('notes'),updated:today()
  };
}
function saveEdit(){
  const c=readForm();
  if(!c.name){alert('Bitte einen Namen eingeben.');return}
  S.slots[edit].coffee=c;
  save();render();closeSheet();
}
function keyOf(c){return((c.name||'')+'|'+(c.roaster||'')).toLowerCase()}
function finish(){
  const c=S.slots[edit].coffee;
  if(!c)return;
  if(!confirm('Kaffee „'+c.name+'“ in die Historie verschieben?'))return;
  const k=keyOf(c);
  let h=S.history.find(x=>keyOf(x)===k);
  if(h){
    h.versions=h.versions||[];
    h.versions.push({date:h.updated,grind:h.grind,time:h.time,dose:h.dose,yield:h.yield,temp:h.temp,profile:h.profile,roastDate:h.roastDate});
    Object.assign(h,c,{versions:h.versions});
  }else{
    S.history.unshift(Object.assign({versions:[]},c));
  }
  S.slots[edit].coffee=null;
  save();render();closeSheet();
}

function openHist(pick){
  const slot=pick===true?edit:null;
  const list=S.history.map((h,i)=>{
    const v=(h.versions||[]).slice().reverse().map(x=>`${x.date||'?'}: Mahlgrad ${x.grind||'?'}, ${x.time||'?'}s, ${x.dose||'?'}→${x.yield||'?'}g${x.profile?', '+x.profile:''}`).join('\n');
    return`<div class="hitem"><div class="t">${esc(h.name)} <span style="font-weight:400;color:#9a9a9f">${esc(h.roaster)}</span></div>
      <div class="s">${esc(h.origin)}${h.tags?' · '+esc(h.tags):''}
Zuletzt (${h.updated||'?'}): Mahlgrad ${h.grind||'?'}, ${h.time||'?'}s, ${h.dose||'?'}→${h.yield||'?'}g${h.temp?', '+h.temp+'°':''}${h.profile?'\nProfil: '+esc(h.profile):''}${h.rating?'\nBewertung: ★ '+h.rating:''}${v?'\n\nFrühere Einstellungen:\n'+esc(v):''}</div>
      <div class="a">
        <button class="primary" onclick="loadHist(${i})">In Slot laden</button>
        <button class="danger" onclick="delHist(${i})">Löschen</button>
      </div></div>`;
  }).join('')||'<div class="sub" style="padding:12px;color:#9a9a9f">Noch keine Einträge.</div>';
  document.getElementById('panel').innerHTML=`<h2>Historie</h2>${list}
    <div class="actions">
      <button onclick="exportData()">Backup exportieren</button>
      <button onclick="document.getElementById('imp').click()">Backup importieren</button>
      <input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this)">
    </div>
    <div class="actions"><button onclick="${slot!=null?'openEdit('+slot+')':'closeSheet()'}">Zurück</button></div>`;
  document.getElementById('sheet').classList.add('open');
  window._histSlot=slot;
}
function loadHist(i){
  let slot=window._histSlot;
  if(slot==null){
    const free=S.slots.findIndex(s=>!s.coffee);
    const ans=prompt('In welchen Slot laden? (1–4)',free>=0?free+1:'1');
    if(!ans)return;
    slot=parseInt(ans)-1;
    if(!(slot>=0&&slot<4))return;
  }
  const h=Object.assign({},S.history[i]);
  delete h.versions;
  openEdit(slot,h);
}
function delHist(i){
  if(!confirm('Eintrag löschen?'))return;
  S.history.splice(i,1);save();openHist(window._histSlot!=null?true:undefined);
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const f=new File([blob],'kaffee-backup-'+today()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f]}).catch(()=>{});
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();
  }
}
function importData(inp){
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.slots||!d.history)throw 0;
      if(confirm('Aktuelle Daten durch Backup ersetzen?')){S=d;save();render();closeSheet()}
    }catch(e){alert('Ungültige Datei.')}
  };
  r.readAsText(file);
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();
</script>
</body>
</html>
